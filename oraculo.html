h1{font-family:Georgia,serif;font-size:clamp(2.1rem,7vw,3rem);font-weight:800;letter-spacing:.08em;background:linear-gradient(90deg,var(--perg),var(--brillo),var(--rosa),var(--brillo),var(--perg));background-size:250% auto;-webkit-background-clip:text;background-clip:text;color:transparent;animation:brillo 6s linear infinite;padding:.1em 0}
@keyframes brillo{to{background-position:250% center}}
.sub{margin-top:.8rem;font-size:.98rem;color:rgba(247,237,216,.85);line-height:1.6;font-weight:300}
.div{position:relative;width:160px;height:1px;background:linear-gradient(90deg,transparent,var(--oro),transparent);margin:1.5rem auto}

.btn::before{content:'';position:absolute;top:0;left:-80%;width:50%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.35),transparent);transform:skewX(-20deg)}

.neutro{border-color:rgba(255,255,255,.2);color:rgba(255,255,255,.65);background:transparent}
.inicio{grid-column:span 2;width:100%;padding:16px;font-size:1.15rem;background:linear-gradient(135deg,var(--oro),#c99a22);color:var(--noche);border:none;box-shadow:0 0 26px rgba(243,199,93,.4);animation:latido 2.4s ease-in-out infinite}

.hist-t{font-size:.75rem;color:var(--oro);font-family:Georgia,serif;letter-spacing:.05em;margin-bottom:.5rem}

.emo{position:absolute;opacity:.32;animation:deriva ease-in-out infinite alternate}

.vela{position:fixed;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:1;display:flex;flex-direction:column;align-items:center;pointer-events:none}

@keyframes llama{0%{transform:scale(1,1) rotate(-3deg)}100%{transform:scale(.88,1.12) rotate(4deg)}}

</style>

const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function sonido(tipo){
  try{
    if(audioCtx.state==='suspended') audioCtx.resume();
    const o=audioCtx.createOscillator(), g=audioCtx.createGain(), t=audioCtx.currentTime;
    o.connect(g); g.connect(audioCtx.destination);
    if(tipo==='clic'){o.type='sine';o.frequency.setValueAtTime(880,t);o.frequency.exponentialRampToValueAtTime(440,t+.14);g.gain.setValueAtTime(.12,t);g.gain.exponentialRampToValueAtTime(.001,t+.14);o.start(t);o.stop(t+.14)}
    else if(tipo==='inicio'){o.type='triangle';o.frequency.setValueAtTime(280,t);o.frequency.exponentialRampToValueAtTime(700,t+.4);g.gain.setValueAtTime(.16,t);g.gain.exponentialRampToValueAtTime(.001,t+.4);o.start(t);o.stop(t+.4)}
    else{o.type='sine';[523.25,659.25,783.99,1046.5].forEach((f,i)=>o.frequency.setValueAtTime(f,t+i*.15));g.gain.setValueAtTime(.18,t);g.gain.exponentialRampToValueAtTime(.001,t+.8);o.start(t);o.stop(t+.8)}

  {id:"gvarios",texto:"¿Da clases en tres o más grados?",test:c=>c.grados.length>=3}
];

let candidatos=[], usadas=new Set(), actual=null, turno=1;
const $ = id => document.getElementById(id);

function iniciar(){
  candidatos = profesores.map(p=>({...p,puntos:10}));
  usadas.clear(); turno=1;
  $('hist-box').style.display='none'; $('hist-lista').innerHTML='';
  $('inicio').style.display='none'; $('resultado').style.display='none'; $('juego').style.display='block';
  siguiente();
}

function mejorPregunta(){
  let vivos = candidatos.filter(c=>c.puntos>3);
  if(!vivos.length) vivos = candidatos;
  let mejor=Infinity, empate=[];
  for(const p of preguntas){
    if(usadas.has(p.id)) continue;
    const si = vivos.filter(p.test).length;
    if(si===0||si===vivos.length) continue; // pregunta inútil: no separa a nadie
    const d = Math.abs(vivos.length/2 - si);
    if(d<mejor){mejor=d;empate=[p]} else if(d===mejor) empate.push(p);
  }
  return empate.length ? empate[Math.floor(Math.random()*empate.length)] : null;
}

function confeti(){
  const col=['#f3c75d','#ffe79e','#a86cff','#ff6ec7','#fff'];
  for(let i=0;i<60;i++){
    const d=document.createElement('div'); d.className='conf';
    d.style.left=Math.random()*100+'vw'; d.style.width=(6+Math.random()*6)+'px'; d.style.height=(10+Math.random()*8)+'px';
    d.style.background=col[i%col.length]; d.style.animationDuration=(2+Math.random()*2.5)+'s'; d.style.animationDelay=(Math.random()*.8)+'s';
    document.body.appendChild(d); setTimeout(()=>d.remove(),5500);
  }
}

function revelar(etq,p){
  sonido('victoria'); confeti();
  $('juego').style.display='none'; $('resultado').style.display='block';
  $('res-contenido').innerHTML=`<div class="rev"><div class="corona">👑</div><div class="etq">✦ ${etq} ✦</div><div class="nombre">${p.nombre}</div><div class="det">${p.detalle}</div></div>`;
}

function siguiente(){
  candidatos.sort((a,b)=>b.puntos-a.puntos);
  const [p1,p2]=candidatos;
  const claridad=Math.min(100,Math.max(5,Math.round(p1.puntos/16*100)));
  $('claridad').innerText=`Claridad: ${claridad}%`; $('barra').style.width=claridad+'%';

  if(p1.puntos>=14 && p1.puntos-p2.puntos>=4) return revelar('Visión Confirmada',p1);
  actual = mejorPregunta();
  if(!actual || turno>20) return revelar('El Oráculo Revela',p1);

  usadas.add(actual.id);
  $('turno').innerText=`Pregunta #${turno}`;
  const q=$('question'); q.classList.remove('fade'); void q.offsetWidth; q.classList.add('fade'); q.innerText=actual.texto;
}

function responder(tipo){
  sonido('clic');
  const txt={si:'Sí',no:'No',talvez:'Tal vez'}[tipo];
  $('hist-box').style.display='block';
  const it=document.createElement('div'); it.className='hi';
  it.innerHTML=`<div>• ${actual.texto}</div><b>${txt}</b>`;
  $('hist-lista').appendChild(it); $('hist-box').scrollTop=$('hist-box').scrollHeight;

  for(const c of candidatos){
    const cumple=actual.test(c);
    if(tipo==='si') c.puntos += cumple?3:-3;
    else if(tipo==='no') c.puntos += cumple?-3:3;
    else if(cumple) c.puntos += 1;
  }
  turno++; siguiente();
}

$('btn-comenzar').onclick=()=>{sonido('inicio');iniciar()};
$('btn-restart').onclick=()=>{sonido('inicio');iniciar()};
$('btn-yes').onclick=()=>responder('si');
$('btn-no').onclick=()=>responder('no');

// Estela mágica al mover el cursor/dedo
let ultimo=0;
function chispa(x,y,n=1,burst=false){
  for(let i=0;i<n;i++){
    const c=document.createElement('span'); c.className='rastro';
    c.textContent=['✦','✧','✨','⋆'][Math.floor(R()*4)];
    c.style.left=x+'px'; c.style.top=y+'px'; c.style.fontSize=(10+R()*12)+'px';
    c.style.setProperty('--dx',(burst?(R()-.5)*160:(R()-.5)*40)+'px');
    c.style.setProperty('--dy',(burst?(R()-.5)*160:20+R()*30)+'px');
    document.body.appendChild(c); setTimeout(()=>c.remove(),900);
  }
}
['mousemove','touchmove'].forEach(ev=>addEventListener(ev,e=>{
  const n=Date.now(); if(n-ultimo<45) return; ultimo=n;
  const p=e.touches?e.touches[0]:e; chispa(p.clientX,p.clientY);
},{passive:true}));
document.addEventListener('click',e=>{ if(e.target.closest('.btn')) chispa(e.clientX,e.clientY,12,true) });
